spring.application.name=ServiceFinder

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/service_finder?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Vishnu@21}
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET:local-dev-secret-key-minimum-32-characters-long}

# HikariCP connection pool — tuned for Railway free tier (low memory, shared DB)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000

# Disable open-in-view to avoid holding DB connections during serialization
spring.jpa.open-in-view=false

# Reduce JPA startup scan time
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Reduce Tomcat threads for low-memory environment
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# Compress HTTP responses (reduces data transfer to frontend)
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=512
